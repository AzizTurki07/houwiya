name: Publish images

# CD: builds the three images and publishes them to GitHub Container Registry on every push
# to main, tagged "latest" and with the commit (sha-xxxxxxx). Deploy them to a cluster with
#   kubectl apply -k k8s/overlays/ghcr
# The packages start private; see k8s/overlays/ghcr/kustomization.yaml to make them public.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ai-service/**'
      - 'frontend/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [backend, ai-service, frontend]

    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; the account name isn't.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/houwiya-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags plus OCI labels, including the source repository (links the package to this repo).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Summary
        run: |
          {
            echo "### houwiya-${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
