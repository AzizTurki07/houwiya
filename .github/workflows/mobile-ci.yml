name: Mobile CI

# Builds the Android app (Capacitor) and attaches an installable debug APK to the run:
# Actions -> this run -> Artifacts -> houwiya-debug-apk.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Capacitor 7's Android modules compile for Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      # The backend URL is compiled into the app. Set the repository variable MOBILE_API_URL
      # (Settings -> Secrets and variables -> Actions -> Variables) to e.g. a public Codespaces
      # port: https://<codespace>-8080.app.github.dev/api. Default: the emulator's host machine.
      - name: Build web app and sync into the Android project
        env:
          MOBILE_API_URL: ${{ vars.MOBILE_API_URL || 'http://10.0.2.2:8080/api' }}
        run: npm run build:mobile

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); missing platforms are fetched by Gradle.
      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: houwiya-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
