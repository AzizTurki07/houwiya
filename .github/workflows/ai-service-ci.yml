name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

  pull_request:
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Tests run inside the production image rather than on the runner: OCR output depends
      # on the exact Tesseract build and language data, so this tests what actually ships
      # (and matches `docker compose` / Codespaces runs exactly).
      - uses: docker/setup-buildx-action@v4

      - name: Build AI service image
        uses: docker/build-push-action@v7
        with:
          context: ai-service
          tags: houwiya-ai:ci
          load: true
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,scope=ai-service,mode=max

      - name: Run tests
        run: docker run --rm houwiya-ai:ci python -m pytest tests/ -v -p no:cacheprovider
