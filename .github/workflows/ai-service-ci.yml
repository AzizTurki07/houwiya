name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

  pull_request:
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Tests run inside the production image rather than on the runner: OCR output depends
      # on the exact Tesseract build and language data, so this tests what actually ships
      # (and matches `docker compose` / Codespaces runs exactly).
      - uses: docker/setup-buildx-action@v3

      - name: Build AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          tags: houwiya-ai:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm houwiya-ai:ci python -m pytest tests/ -v
