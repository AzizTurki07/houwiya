spring:
  application:
    name: id-onboarding-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding}
    username: ${DB_USER:onboarding}
    password: ${DB_PASSWORD:onboarding}
  jpa:
    hibernate:
      # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks
      # that the entities still match it and fails fast at startup if they don't.
      ddl-auto: validate
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-before-any-real-use}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:60}   # OCR on a large photo can take a few seconds
  cors:
    # Angular dev server, Codespaces forwarded URLs, and the Capacitor app's WebView origins
    # (Android: https://localhost, iOS: capacitor://localhost). Auth is a bearer token, not a
    # cookie, so these origins can't ride on a logged-in session.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.app.github.dev,https://localhost,capacitor://localhost}
  review:
    # Below this OCR confidence, a document can't be auto-approved and goes to the admin queue.
    min-confidence: ${REVIEW_MIN_CONFIDENCE:0.7}
  face:
    # Selfie + face match is part of the flow (confirm needs it). Must match the AI service's
    # MATCH_THRESHOLD, which is only used here for display to reviewers.
    required: ${FACE_MATCH_REQUIRED:true}
    match-threshold: 0.45
  crypto:
    # AES-256 key (base64, 32 bytes) for personal data at rest. The default is a PUBLIC dev key
    # (it's in this file): set APP_ENCRYPTION_KEY to your own for anything beyond local dev,
    # e.g. `openssl rand -base64 32`. Changing it makes existing encrypted data unreadable.
    key: ${APP_ENCRYPTION_KEY:REVWLU9OTFktS0VZLW5ldmVyLXVzZS1mb3ItcmVhbCE=}
  admin:
    # Creates (or promotes) this account as ADMIN at startup. Leave empty to skip.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    # Off by default: decision e-mails are only logged until SMTP (spring.mail.*) is set up.
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@houwiya.local}
  rate-limit:
    # Per client IP on /api/auth/login and /api/auth/register.
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    # Per signed-in user on document uploads (each one is an OCR run).
    uploads-per-hour: ${RATE_LIMIT_UPLOADS_PER_HOUR:30}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
