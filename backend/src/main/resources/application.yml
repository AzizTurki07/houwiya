spring:
  application:
    name: id-onboarding-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding}
    username: ${DB_USER:onboarding}
    password: ${DB_PASSWORD:onboarding}
  jpa:
    hibernate:
      ddl-auto: update   # fine for a dev/internship project; use migrations (Flyway) if you productionize later
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-before-any-real-use}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:60}   # OCR on a large photo can take a few seconds
  review:
    # Below this OCR confidence, a document can't be auto-approved and goes to the admin queue.
    min-confidence: ${REVIEW_MIN_CONFIDENCE:0.7}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
