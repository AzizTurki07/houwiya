spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway builds the schema in tests too (H2 in PostgreSQL mode), so the migrations are
      # exercised on every run. Type validation is left to the real Postgres at startup.
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test-only-secret-not-for-real-use-1234567890
    expiration-ms: 3600000
  ai-service:
    base-url: http://localhost:8000
  crypto:
    key: VEVTVC1PTkxZLUtFWS1ub3QtZm9yLXJlYWwtdXNlISE=
  admin:
    email: admin@test.local
    password: admin-test-password
  face:
    # Off for the document-flow tests; FaceMatchTest switches it on.
    required: false
  rate-limit:
    # High enough that ordinary tests never trip it; RateLimitTest overrides these.
    auth-per-minute: 10000
    uploads-per-hour: 10000
