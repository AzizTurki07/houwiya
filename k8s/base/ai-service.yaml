apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: houwiya-ai-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Keep serving for a few seconds after being told to stop, until every node has
          # removed this pod from the Service -- otherwise a redeploy causes brief 502s.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
          # The face models load on first use, so /health answers quickly.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          # Tesseract + OpenCV + face models: about 1 GB in use under load.
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
