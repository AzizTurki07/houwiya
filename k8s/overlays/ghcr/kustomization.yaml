# Images published to GitHub Container Registry by .github/workflows/publish-images.yml.
# They follow the repository's visibility: public here, so pulling needs no credentials.
# (For a private repository, add an imagePullSecret for ghcr.io.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: houwiya-backend
    newName: ghcr.io/azizturki07/houwiya-backend
    newTag: latest
  - name: houwiya-ai-service
    newName: ghcr.io/azizturki07/houwiya-ai-service
    newTag: latest
  - name: houwiya-frontend
    newName: ghcr.io/azizturki07/houwiya-frontend
    newTag: latest
patches:
  # "latest" moves with every publish: always check for a newer image on (re)start.
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
